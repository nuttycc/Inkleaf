<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Inkleaf App Icon Candidates</title>
    <style>
        body {
          margin: 0;
          background: #f5f6f8;
          color: #20242a;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
          max-width: 920px;
          margin: 0 auto;
          padding: 32px 20px 44px;
        }
        h1 {
          margin: 0 0 20px;
          font-size: 24px;
          font-weight: 650;
          letter-spacing: 0;
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
          gap: 16px;
        }
        article {
          background: #fff;
          border: 1px solid #dadde3;
          border-radius: 8px;
          padding: 16px;
        }
        img {
          width: 108px;
          height: 108px;
          display: block;
          margin: 0 auto 12px;
        }
        h2 {
          margin: 0;
          font-size: 14px;
          font-weight: 650;
          letter-spacing: 0;
          text-align: center;
        }
        p {
          margin: 4px 0 0;
          color: #626975;
          font-size: 11px;
          text-align: center;
        }
    </style>
</head>
<body>
<main>
    <h1>Inkleaf App Icon Candidates</h1>
    <section class="grid">

        <article>
            <img alt="Leaf Page" src="out/inkleaf-icon-a-leaf-page.svg">
            <h2>Leaf Page</h2>
            <p>a-leaf-page</p>
        </article>

        <article>
            <img alt="Panel Leaf" src="out/inkleaf-icon-b-panel-leaf.svg">
            <h2>Panel Leaf</h2>
            <p>b-panel-leaf</p>
        </article>

        <article>
            <img alt="Folded Page" src="out/inkleaf-icon-c-folded-page.svg">
            <h2>Folded Page</h2>
            <p>c-folded-page</p>
        </article>

        <article>
            <img alt="Ink Drop" src="out/inkleaf-icon-d-ink-drop.svg">
            <h2>Ink Drop</h2>
            <p>d-ink-drop</p>
        </article>

        <article>
            <img alt="Shelf Mark" src="out/inkleaf-icon-e-shelf-mark.svg">
            <h2>Shelf Mark</h2>
            <p>e-shelf-mark</p>
        </article>
    </section>
</main>
</body>
</html>
