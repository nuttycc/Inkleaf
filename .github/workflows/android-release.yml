name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and publish, for example v0.2.0
        required: true
        type: string
  push:
    tags:
      # Glob approximates semver; the job enforces strict vMAJOR.MINOR.PATCH.
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH (got: $TAG)" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Validate tag, main ancestry, and version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH (got: $TAG)" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $TAG (commit $(git rev-parse --short HEAD)) is not an ancestor of origin/main." >&2
            echo "Only commits on main may be released." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "workflow_dispatch only rebuilds existing tags; $TAG was not found." >&2
              exit 1
            fi
          fi

          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

          echo "Release $TAG → versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Validate signing secrets
        run: |
          test -n "$INKLEAF_KEYSTORE_BASE64"
          test -n "$INKLEAF_KEYSTORE_PASSWORD"
          test -n "$INKLEAF_KEY_ALIAS"
          test -n "$INKLEAF_KEY_PASSWORD"
        env:
          INKLEAF_KEYSTORE_BASE64: ${{ secrets.INKLEAF_KEYSTORE_BASE64 }}
          INKLEAF_KEYSTORE_PASSWORD: ${{ secrets.INKLEAF_KEYSTORE_PASSWORD }}
          INKLEAF_KEY_ALIAS: ${{ secrets.INKLEAF_KEY_ALIAS }}
          INKLEAF_KEY_PASSWORD: ${{ secrets.INKLEAF_KEY_PASSWORD }}

      - name: Restore release keystore
        run: printf '%s' "$INKLEAF_KEYSTORE_BASE64" | base64 --decode > app/inkleaf-release.jks
        env:
          INKLEAF_KEYSTORE_BASE64: ${{ secrets.INKLEAF_KEYSTORE_BASE64 }}

      - name: Run unit tests and build release APK
        # A single invocation avoids duplicate Gradle startup/configuration and
        # lets Gradle schedule both tasks in one graph. Signing env is only read
        # by assembleRelease; harmless to expose to testDebugUnitTest. A 6g heap leaves room for
        # AAPT2/Kotlin workers on 4C/16G runner; Kotlin daemon (default strategy)
        # avoids classloading contention with parallel workers.
        run: |
          ./gradlew testDebugUnitTest assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.priority=normal
        env:
          INKLEAF_KEYSTORE_FILE: ${{ github.workspace }}/app/inkleaf-release.jks
          INKLEAF_KEYSTORE_PASSWORD: ${{ secrets.INKLEAF_KEYSTORE_PASSWORD }}
          INKLEAF_KEY_ALIAS: ${{ secrets.INKLEAF_KEY_ALIAS }}
          INKLEAF_KEY_PASSWORD: ${{ secrets.INKLEAF_KEY_PASSWORD }}
          INKLEAF_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          INKLEAF_VERSION_CODE: ${{ steps.meta.outputs.version_code }}

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk \
            "release/Inkleaf-${RELEASE_TAG}-release.apk"
          cp app/build/outputs/mapping/release/mapping.txt \
            "release/Inkleaf-${RELEASE_TAG}-mapping.txt"
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            release/Inkleaf-${{ steps.meta.outputs.tag }}-release.apk
            release/Inkleaf-${{ steps.meta.outputs.tag }}-mapping.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
