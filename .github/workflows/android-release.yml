name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish, for example v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate signing secrets
        run: |
          test -n "$INKLEAF_KEYSTORE_BASE64"
          test -n "$INKLEAF_KEYSTORE_PASSWORD"
          test -n "$INKLEAF_KEY_ALIAS"
          test -n "$INKLEAF_KEY_PASSWORD"
        env:
          INKLEAF_KEYSTORE_BASE64: ${{ secrets.INKLEAF_KEYSTORE_BASE64 }}
          INKLEAF_KEYSTORE_PASSWORD: ${{ secrets.INKLEAF_KEYSTORE_PASSWORD }}
          INKLEAF_KEY_ALIAS: ${{ secrets.INKLEAF_KEY_ALIAS }}
          INKLEAF_KEY_PASSWORD: ${{ secrets.INKLEAF_KEY_PASSWORD }}

      - name: Restore release keystore
        run: printf '%s' "$INKLEAF_KEYSTORE_BASE64" | base64 --decode > app/inkleaf-release.jks
        env:
          INKLEAF_KEYSTORE_BASE64: ${{ secrets.INKLEAF_KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          INKLEAF_KEYSTORE_FILE: ${{ github.workspace }}/app/inkleaf-release.jks
          INKLEAF_KEYSTORE_PASSWORD: ${{ secrets.INKLEAF_KEYSTORE_PASSWORD }}
          INKLEAF_KEY_ALIAS: ${{ secrets.INKLEAF_KEY_ALIAS }}
          INKLEAF_KEY_PASSWORD: ${{ secrets.INKLEAF_KEY_PASSWORD }}

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk "release/Inkleaf-${RELEASE_TAG}-release.apk"
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: release/*.apk
          generate_release_notes: true
