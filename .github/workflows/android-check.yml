name: Android Check

run-name: Android Check (${{ github.event_name == 'workflow_dispatch' && inputs.task || 'check' }})

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      task:
        description: Check level
        required: true
        default: full
        type: choice
        options:
          # compile + unit tests + lint (no full APK assemble)
          - check
          # debug APK only
          - apk
          # assembleDebug + unit tests + androidTest compile + lint
          - full

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Run check (${{ github.event_name == 'workflow_dispatch' && inputs.task || 'check' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'check' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Classify changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_gradle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Unable to identify a comparison base; running Gradle checks."
            echo "run_gradle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          run_gradle=false
          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|design/*|.agents/*|.claude/*|.docs/*|.entire/*|.gemini/*|.impeccable/*|.superpowers/*|.trae/*|.workbuddy/*)
                ;;
              *)
                run_gradle=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "run_gradle=$run_gradle" >> "$GITHUB_OUTPUT"
          if [ "$run_gradle" = "false" ]; then
            echo "Only documentation, design, or agent metadata changed; skipping Gradle checks."
          fi

      - name: Set up JDK
        if: steps.changes.outputs.run_gradle == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        if: steps.changes.outputs.run_gradle == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run selected check
        if: steps.changes.outputs.run_gradle == 'true'
        # Public ubuntu-latest is 4C/16G. -Xmx6g leaves room for AAPT2/Kotlin
        # workers/OS page cache; Kotlin daemon (default strategy) reuses JIT
        # across tasks and avoids classloading contention with parallel workers.
        run: |
          GRADLE_ARGS=(
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
            -Dorg.gradle.workers.max=4
            -Dorg.gradle.parallel=true
            -Dorg.gradle.priority=normal
          )
          case "$CHECK_LEVEL" in
            check)
              ./gradlew testDebugUnitTest lintDebug "${GRADLE_ARGS[@]}"
              ;;
            apk)
              ./gradlew assembleDebug "${GRADLE_ARGS[@]}"
              ;;
            full)
              ./gradlew assembleDebug :app:compileDebugAndroidTestKotlin testDebugUnitTest lintDebug "${GRADLE_ARGS[@]}"
              ;;
            *)
              echo "Unsupported check level: $CHECK_LEVEL" >&2
              exit 1
              ;;
          esac

      - name: Upload debug APK
        if: steps.changes.outputs.run_gradle == 'true' && (env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inkleaf-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload lint report
        if: failure() && steps.changes.outputs.run_gradle == 'true' && (env.CHECK_LEVEL == 'check' || env.CHECK_LEVEL == 'full')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
