name: Android Check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install native toolchain
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.30.5"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build, test, and lint
        # Private ubuntu-latest is 2C/8G: one fat Gradle JVM (Kotlin in-process).
        run: |
          ./gradlew assembleDebug testDebugUnitTest lintDebug \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.priority=normal

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
