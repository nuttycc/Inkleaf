name: Android Check

run-name: Android Check (${{ github.event_name == 'pull_request' && 'check' || inputs.task }})

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      task:
        description: Check level
        required: true
        default: full
        type: choice
        options:
          # compile + unit tests + lint (no full APK assemble)
          - check
          # debug APK only
          - apk
          # assembleDebug + unit tests + androidTest compile + lint
          - full

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Run check (${{ github.event_name == 'pull_request' && 'check' || inputs.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_LEVEL: ${{ github.event_name == 'pull_request' && 'check' || inputs.task }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Run selected check
        # Public ubuntu-latest is 4C/16G. -Xmx6g leaves room for AAPT2/Kotlin
        # workers/OS page cache; Kotlin daemon (default strategy) reuses JIT
        # across tasks and avoids classloading contention with parallel workers.
        run: |
          GRADLE_ARGS=(
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
            -Dorg.gradle.workers.max=4
            -Dorg.gradle.parallel=true
            -Dorg.gradle.priority=normal
          )
          case "$CHECK_LEVEL" in
            check)
              ./gradlew testDebugUnitTest lintDebug "${GRADLE_ARGS[@]}"
              ;;
            apk)
              ./gradlew assembleDebug "${GRADLE_ARGS[@]}"
              ;;
            full)
              ./gradlew assembleDebug :app:compileDebugAndroidTestKotlin testDebugUnitTest lintDebug "${GRADLE_ARGS[@]}"
              ;;
            *)
              echo "Unsupported check level: $CHECK_LEVEL" >&2
              exit 1
              ;;
          esac

      - name: Upload debug APK
        if: env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inkleaf-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload lint report
        if: failure() && (env.CHECK_LEVEL == 'check' || env.CHECK_LEVEL == 'full')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
