name: Android Check

run-name: Android Check (${{ inputs.task }})

on:
  workflow_dispatch:
    inputs:
      task:
        description: Check level
        required: true
        default: full
        type: choice
        options:
          # compile + unit tests + lint (no full APK assemble)
          - check
          # debug APK only
          - apk
          # assembleDebug + unit tests + androidTest compile + lint
          - full

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Run check (${{ inputs.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_LEVEL: ${{ inputs.task }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print runner system info
        # Helps verify runner specs (4C/16G), JVM default, and available tools
        # when diagnosing CI memory/parallelism tuning.
        run: |
          echo "=== OS ==="
          cat /etc/os-release | head -5
          echo "=== CPU ==="
          nproc
          grep -c ^processor /proc/cpuinfo
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h /
          echo "=== Java (default) ==="
          which java && java -version 2>&1 || echo "no java on PATH yet"
          echo "=== Ninja ==="
          which ninja && ninja --version || echo "no ninja"
          echo "=== Gradle (if preinstalled) ==="
          which gradle && gradle --version 2>&1 | head -10 || echo "no gradle on PATH"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        if: env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full'
        uses: android-actions/setup-android@v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run selected check
        # Public ubuntu-latest is 4C/16G. -Xmx6g leaves room for AAPT2/Kotlin
        # workers/OS page cache; Kotlin daemon (default strategy) reuses JIT
        # across tasks and avoids classloading contention with parallel workers.
        run: |
          GRADLE_ARGS=(
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
            -Dorg.gradle.workers.max=4
            -Dorg.gradle.parallel=true
            -Dorg.gradle.priority=normal
          )
          case "$CHECK_LEVEL" in
            check)
              ./gradlew :app:compileDebugKotlin testDebugUnitTest lintDebug "${GRADLE_ARGS[@]}"
              ;;
            apk)
              ./gradlew assembleDebug "${GRADLE_ARGS[@]}"
              ;;
            full)
              ./gradlew assembleDebug :app:compileDebugAndroidTestKotlin testDebugUnitTest lintDebug "${GRADLE_ARGS[@]}"
              ;;
            *)
              echo "Unsupported check level: $CHECK_LEVEL" >&2
              exit 1
              ;;
          esac

      - name: Upload debug APK
        if: env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: inkleaf-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint report
        if: failure() && (env.CHECK_LEVEL == 'check' || env.CHECK_LEVEL == 'full')
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
