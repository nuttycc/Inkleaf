name: Android Dev Check

on:
  workflow_dispatch:
    inputs:
      task:
        description: Check level
        required: true
        default: check
        type: choice
        options:
          - check
          - apk
          - full
  push:
    branches:
      - "codex/**"
      - "dev/**"

permissions:
  contents: read

concurrency:
  group: android-dev-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Run development check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'check' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install native toolchain
        if: env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full'
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.30.5"

      - name: Run selected check
        run: |
          case "$CHECK_LEVEL" in
            check)
              ./gradlew testDebugUnitTest lintDebug
              ;;
            apk)
              ./gradlew assembleDebug
              ;;
            full)
              ./gradlew assembleDebug testDebugUnitTest lintDebug
              ;;
            *)
              echo "Unsupported check level: $CHECK_LEVEL" >&2
              exit 1
              ;;
          esac

      - name: Upload debug APK
        if: env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: inkleaf-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint report
        if: failure() && (env.CHECK_LEVEL == 'check' || env.CHECK_LEVEL == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
