name: Android Dev Check

run-name: Android Dev Check (${{ inputs.task }})

on:
  workflow_dispatch:
    inputs:
      task:
        description: Check level
        required: true
        default: check
        type: choice
        options:
          - check
          - apk
          - full

permissions:
  contents: read

concurrency:
  group: android-dev-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Run development check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_LEVEL: ${{ inputs.task }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full'
        uses: android-actions/setup-android@v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install native toolchain
        if: env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full'
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.30.5"

      - name: Run selected check
        # Private ubuntu-latest is 2C/8G (not public 4C/16G).
        run: |
          GRADLE_ARGS=(
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
            -Dkotlin.daemon.jvmargs="-Xmx1536m"
            -Dorg.gradle.workers.max=2
            -Dorg.gradle.priority=normal
          )
          case "$CHECK_LEVEL" in
            check)
              ./gradlew :app:compileDebugKotlin testDebugUnitTest lintDebug "${GRADLE_ARGS[@]}"
              ;;
            apk)
              ./gradlew assembleDebug "${GRADLE_ARGS[@]}"
              ;;
            full)
              ./gradlew assembleDebug testDebugUnitTest lintDebug "${GRADLE_ARGS[@]}"
              ;;
            *)
              echo "Unsupported check level: $CHECK_LEVEL" >&2
              exit 1
              ;;
          esac

      - name: Upload debug APK
        if: env.CHECK_LEVEL == 'apk' || env.CHECK_LEVEL == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: inkleaf-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint report
        if: failure() && (env.CHECK_LEVEL == 'check' || env.CHECK_LEVEL == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
