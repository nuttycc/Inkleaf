name: Gradle Cache Validation

run-name: Gradle cache validation (${{ inputs.experiments }})

on:
  workflow_dispatch:
    inputs:
      experiments:
        description: Experiments to run in order
        required: true
        default: 1-3
        type: choice
        options:
          - "1"
          - 1-2
          - 1-3
      develocity_url:
        description: Develocity server URL used for Build Scan analysis
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gradle-cache-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Run experiments ${{ inputs.experiments }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      VALIDATION_TASKS: testDebugUnitTest lintDebug
      GRADLE_ARGS: >-
        -Dorg.gradle.jvmargs=-Xmx6g\ -XX:MaxMetaspaceSize=1g\ -XX:+UseParallelGC\ -Dfile.encoding=UTF-8
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.parallel=true
        -Dorg.gradle.priority=normal

    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: project-to-validate

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Validate Develocity URL
        env:
          DEVELOCITY_URL: ${{ inputs.develocity_url }}
        run: |
          if [[ ! "$DEVELOCITY_URL" =~ ^https://[^/]+(/.*)?$ ]]; then
            echo "develocity_url must be an HTTPS URL." >&2
            exit 1
          fi

      - name: Download validation scripts
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/download@ed4c1c3cfea30793b858e16521d3101e125e42bc # main 2026-07-25
        with:
          token: ${{ github.token }}

      - name: Validate incremental builds
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-1@ed4c1c3cfea30793b858e16521d3101e125e42bc # main 2026-07-25
        with:
          gitRepo: file://${{ github.workspace }}/project-to-validate
          gitCommitId: ${{ github.sha }}
          tasks: ${{ env.VALIDATION_TASKS }}
          args: ${{ env.GRADLE_ARGS }}
          develocityUrl: ${{ inputs.develocity_url }}
          enableDevelocity: true

      - name: Validate local build cache in the same location
        if: inputs.experiments == '1-2' || inputs.experiments == '1-3'
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-2@ed4c1c3cfea30793b858e16521d3101e125e42bc # main 2026-07-25
        with:
          gitRepo: file://${{ github.workspace }}/project-to-validate
          gitCommitId: ${{ github.sha }}
          tasks: ${{ env.VALIDATION_TASKS }}
          args: ${{ env.GRADLE_ARGS }}
          develocityUrl: ${{ inputs.develocity_url }}
          enableDevelocity: true

      - name: Validate local build cache across locations
        if: inputs.experiments == '1-3'
        uses: gradle/develocity-build-validation-scripts/.github/actions/gradle/experiment-3@ed4c1c3cfea30793b858e16521d3101e125e42bc # main 2026-07-25
        with:
          gitRepo: file://${{ github.workspace }}/project-to-validate
          gitCommitId: ${{ github.sha }}
          tasks: ${{ env.VALIDATION_TASKS }}
          args: ${{ env.GRADLE_ARGS }}
          develocityUrl: ${{ inputs.develocity_url }}
          enableDevelocity: true
